name: MyToolVerse Daily SEO Agent

on:
  schedule:
    # 04:00 UTC daily. Adjust to taste.
    - cron: "0 4 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  seo-crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: seo-agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run daily SEO agent
        working-directory: seo-agent
        env:
          SITE_BASE_URL: https://mytoolverse.com
          # Phase 2+ secrets, only needed once those phases are wired up:
          # GOOGLE_SEARCH_CONSOLE_CREDENTIALS_JSON: ${{ secrets.GSC_CREDENTIALS_JSON }}
          # GOOGLE_ANALYTICS_CREDENTIALS_JSON: ${{ secrets.GA4_CREDENTIALS_JSON }}
          # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py

      - name: Commit report + updated crawl history
        run: |
          git config user.name "seo-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seo-agent/reports seo-agent/cache
          git diff --cached --quiet || git commit -m "chore(seo): daily crawl report $(date -u +%Y-%m-%d)"
          git push
